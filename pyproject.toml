[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmfleet"
version = "0.1.0"
description = "Fleet-level batch dispatcher for LLM APIs. Pool requests across coroutines, route to provider Batch APIs, save 50% on cost without rewriting your agent loops."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MukundaKatta" }]
requires-python = ">=3.10"
keywords = ["llm", "anthropic", "batch-api", "dispatcher", "agent", "cost-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/llmfleet"
Issues = "https://github.com/MukundaKatta/llmfleet/issues"
Repository = "https://github.com/MukundaKatta/llmfleet"

[tool.hatch.build.targets.wheel]
packages = ["src/llmfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
